name: Regenerate commercial report figures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned chart dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Validate report evidence and regenerate all four figures
        run: |
          python tests/check_report_evidence.py
          python src/plotting/build_report.py --output private/ci-report
          python tests/check_report_render.py private/ci-report
      - name: Retain regenerated figures and validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commercial-report-figures
          path: |
            private/ci-report/figures/
            private/ci-report/build-manifest.json
          if-no-files-found: error
          retention-days: 30
